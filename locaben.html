document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.calm!==undefined){st.calM=+b.dataset.calm;render();return}

  if(b.dataset.m){readInputs();st.method=b.dataset.m;if(!dates().includes(st.date))st.date='';if(st.date&&st.time&&!daySlots(st.date).includes(st.time))st.time='';save();render();return}
  if(b.dataset.pay!==undefined){readInputs();st.pay=b.dataset.pay;save();render();return}
  if(b.dataset.date){readInputs();st.date=b.dataset.date;if(st.time&&!daySlots(st.date).includes(st.time))st.time='';save();render();return}
  if(b.dataset.time){readInputs();st.time=st.time===b.dataset.time?'':b.dataset.time;save();render();return}
  if(b.id==='toConfirm'||b.id==='toConfirm2')confirmView();
  if(b.id==='clearProf')clearProfile();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.fn!==undefined){st.fn=st.fn||{};st.fn[t.dataset.fn]=t.value;save();return}if(t.dataset.fp!==undefined){st.fp=st.fp||{};const v=Math.max(0,parseInt(toHalf(String(t.value)).replace(/[^0-9]/g,''))||0);st.fp[t.dataset.fp]=v;save();updateBar();const bd=t.closest('.body');const sp=bd&&bd.querySelector('.nm span');const mm=D.menu.find(x=>x.id===t.dataset.fp);if(sp&&mm)sp.textContent=yen(v)+'/'+(mm.unit||'')+((mm.priceMode==='excl'||(!mm.priceMode&&T.mode==='excl'))?'（税別）':'');return}if(t.dataset.q!==undefined){st.qty[t.dataset.q]=Math.max(0,parseInt(String(t.value).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)))||0);save();updateBar()}else if(t.id&&t.id.startsWith('i_'))readInputs()});
render();
/* 臨時休業日：Googleスプレッドシート（お弁当フォーム 臨時休業日）から読み込む */
if(C.holidaySheet&&C.rollingDays){window.__hol=r=>{try{const L=[];((r.table||{}).rows||[]).forEach(row=>{const c=(row.c||[])[0];if(!c||c.v==null)return;let v=String(c.v);let m=v.match(/^Date\((\d+),(\d+),(\d+)/);if(m){L.push(m[1]+'-'+pad(+m[2]+1)+'-'+pad(+m[3]));return}m=toHalf(v).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(m)L.push(m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]))});
  if(!L.length)return;C.holidays=[...new Set([...(C.holidays||[]),...L])];rollDates();if(st.date&&!dates().includes(st.date))st.date='';render()}catch(e){}};
  const sc=document.createElement('script');sc.src='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(C.holidaySheet)+'/gviz/tq?tqx=out:json;responseHandler:__hol&tq='+encodeURIComponent('select A')+'&_='+Date.now();sc.async=true;document.body.appendChild(sc)}
})();
</script>
