    <button type="button" class="btn" id="copyBtn">文面をコピーする（LINEが開かない時）</button>
    <div class="note">パソコン・iPadでLINEが開かない時は、文面をコピーしてLINEのトークに貼り付けて送ってください。${s.tel?`お電話（<a href="tel:${esc(String(s.tel).replace(/[^0-9+]/g,''))}">${esc(s.tel)}</a>${s.telHours?'・'+esc(s.telHours):''}）${s.fax?`・FAX（${esc(s.fax)}）`:''}でも承ります。`:''}</div>
    <div class="note">見込み合計は目安です。お店からの受付完了のご連絡で金額が確定します。</div>
    <div class="warn">送信後、${D.confirmPhrase?esc(D.confirmPhrase)+'に':''}お店から受付完了のご連絡がない場合は、お手数ですが${D.contactBack?esc(D.contactBack):'お電話またはLINEでお店にご連絡ください。'}</div></section>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
const lb=box.querySelector('.btn.line');if(lb)lb.addEventListener('click',()=>sendSheet(oid,text));
  $('#copyBtn').onclick=async()=>{sendSheet(oid,text);try{await navigator.clipboard.writeText(text);$('#copyBtn').textContent='コピーしました。LINEのトークに貼り付けて送ってください'}catch(e){const sel=getSelection(),rg=document.createRange();rg.selectNodeContents($('#msgText'));sel.removeAllRanges();sel.addRange(rg);$('#copyBtn').textContent='文面を選択しました。コピーしてLINEに貼り付けてください'}};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.d){const k=b.dataset.k;st.qty[k]=Math.max(0,(+st.qty[k]||0)+(+b.dataset.d));const i=document.querySelector(`[data-q="${CSS.escape(k)}"]`);if(i)i.value=st.qty[k]||'';save();updateBar();return}
  if(b.dataset.m){readInputs();st.method=b.dataset.m;if(!dates().includes(st.date))st.date='';save();render();return}
  if(b.dataset.date){readInputs();st.date=b.dataset.date;save();render();return}
  if(b.dataset.time){readInputs();st.time=st.time===b.dataset.time?'':b.dataset.time;save();render();return}
  if(b.id==='toConfirm'||b.id==='toConfirm2')confirmView();
  if(b.id==='clearProf')clearProfile();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q!==undefined){st.qty[t.dataset.q]=Math.max(0,parseInt(String(t.value).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)))||0);save();updateBar()}else if(t.id&&t.id.startsWith('i_'))readInputs()});
render();
})();
</script>
</body></html>
