  if(ad){if(!ad.value.trim()||!ad.value.startsWith(a)){ad.value=a}ad.focus();ad.setSelectionRange(ad.value.length,ad.value.length)}
  st.zip=fmtZip(z);st.address=ad?ad.value:a;save();if(msg)msg.textContent='住所を入れました。続けて番地・建物名をご記入ください';
}
function updateBar(){const r=calc();$('#bar').hidden=false;$('#barTot').textContent=yen(r.tot);const nt=`${r.items.reduce((a,b)=>a+b.q,0)}点`+(r.rate?`・${Math.round(r.rate*100)}%割引後`:'')+'・税込';$('#barNote').textContent=nt;
  const sl=$('#sumList');if(sl){sl.innerHTML=r.items.length?r.items.map(i=>`<div style="display:flex;justify-content:space-between;gap:8px;color:var(--ink)"><span>${esc(i.m.name)}${Object.values(i.cb.opts).length?'<span class="note">（'+esc(Object.values(i.cb.opts).join('・'))+'）</span>':''}</span><span style="white-space:nowrap">×${i.q}</span></div>`).join(''):'まだ選ばれていません';$('#sumTot2').textContent=yen(r.tot);$('#sumNote2').textContent=nt}}
function readInputs(){['name','kana','phone','email','zip','address','note','timeNote'].forEach(k=>{const el=$('#i_'+k);if(el)st[k]=el.value.trim()});save()}
function message(r){const s=D.shop||{};
  return [`【ご注文】${s.name||''} ${C.name||''}`.trim(),st.ono?`■受付番号：${st.ono}`:'',`■お名前：${st.name}${st.kana?`（${st.kana}）`:''}`,`■電話：${st.phone}`,st.email?`■メール：${st.email}`:'',`■受取：${st.method==='delivery'?'配送':'店頭引取'} ${md(st.date)} ${st.time||'時間おまかせ'}`,st.timeNote?`■時間の備考：${st.timeNote}`:'',
    `${st.method==='delivery'?'■お届け先：':'■ご住所：'}${st.zip?'〒'+fmtZip(st.zip)+' ':''}${st.address}`, '■ご注文：',...r.items.map(i=>`・${i.m.name}${Object.values(i.cb.opts).length?'［'+Object.values(i.cb.opts).join('・')+'］':''} ×${i.q}`),
    `■見込み合計：${yen(r.tot)}（税込${r.rate?`・${r.why}${Math.round(r.rate*100)}%割引後`:''}）`,st.pay?`■お支払い：${st.pay}`:'',st.note?`■ご要望：${st.note}`:'',`■送信日：${today.slice(0,4)}年${+today.slice(5,7)}月${+today.slice(8,10)}日`,'（注文フォームより送信）'].filter(Boolean).join('\n')}
/* 注文をお店の受信用スプレッドシートにも届けます（LINEの送信とは別。失敗してもLINEの注文には影響しません） */
const sentIds=new Set();
function sendInbox(text){const u=String(D.inbox||'');if(!/^https:\/\/script\.google\.com\//.test(u)||!st.oid||sentIds.has(st.oid))return;sentIds.add(st.oid);
  const body=JSON.stringify({id:st.oid,text,form:C.name||''});let ok=false;try{ok=navigator.sendBeacon(u,new Blob([body],{type:'text/plain;charset=utf-8'}))}catch(e){}
  if(!ok){try{fetch(u,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body}).catch(()=>{})}catch(e){}}}
/* 送信後：お客様用の「ご注文控え」（印刷・スクリーンショット保存） */
function showKeep(){const k=$('#keepArea');if(!k)return;const h=$('#orderCard h2');if(h)h.textContent='ご注文の控え';
  k.innerHTML=`<div class="info keep"><b>この画面がご注文の控えです。</b>受付番号：<b>${esc(st.ono||'')}</b><br><span class="note">あとで内容を確かめたり、お問い合わせのときにお使いいただけます。スクリーンショットで保存するか、下のボタンで印刷してください。${st.email?'<br>ご注文内容の控えは <b>'+esc(st.email)+'</b> あてにもメールでお届けします。':''}<br>お店で内容を確認したあと、<b>受付完了のご連絡</b>をお送りして、ご注文が確定します。</span>
  <button type="button" class="btn noprint" id="printBtn" style="width:100%;margin-top:8px">控えを印刷する</button></div>`;
  $('#printBtn').onclick=()=>window.print()}
function confirmView(){
  readInputs();const r=calc();const errs=[];
  if(!r.items.length)errs.push('ご注文の数量を入れてください');if(!st.date)errs.push('お受け取りの日にちを選んでください');if(!st.name)errs.push('お名前を入れてください');if(!st.phone)errs.push('電話番号を入れてください');else{const pd=toHalf(st.phone).replace(/\D/g,'');if(!/^0\d{9,10}$/.test(pd))errs.push('電話番号は市外局番から10桁か11桁で入れてください（例：090-1234-5678）')}if(!st.address)errs.push(st.method==='delivery'?'お届け先のご住所を入れてください':'ご住所を入れてください');if((D.payMethods||[]).length&&!st.pay)errs.push('お支払い方法を選んでください');
  {const hp=$('#i_hp');if(hp&&hp.value.trim())errs.push('送信できませんでした。お手数ですがお電話でご注文ください。')}
  if(Date.now()-T0<6000)errs.push('入力内容をもう一度ご確認のうえ、「内容を確認する」を押してください。');
  {const over=r.items.filter(i=>i.q>G.maxQty);if(over.length)errs.push(`1品目${G.maxQty}点を超えるご注文は、お電話（${(D.shop||{}).tel||'お店'}）で承ります（${over.map(i=>i.m.name).join('、')}）`)}
  if(G.daily&&sentToday()>=G.daily)errs.push(`この端末からの本日のご注文は${G.daily}回までです。追加のご注文はお電話（${(D.shop||{}).tel||'お店'}）でお願いいたします。`);
  if(C.minOrder&&r.tot<C.minOrder)errs.push(`${yen(C.minOrder)}（税込）以上のご注文で承ります`);
  const box=$('#confirm');
  if(errs.length){box.innerHTML=`<div class="warn">${errs.map(esc).join('<br>')}</div>`;box.scrollIntoView({behavior:'smooth',block:'center'});return}
  saveProfile();const sig=JSON.stringify([st.qty,st.method,st.date,st.time,st.name,st.phone,st.email,st.address,st.note,st.timeNote,st.pay]);if(!st.oid||st.oidSig!==sig){st.ono=makeNo();st.oid=st.ono+'-'+Math.random().toString(36).slice(2,6).toUpperCase();st.oidSig=sig;save()}const text=message(r);const s=D.shop||{};const id=String(s.lineId||'').trim();
  const isPC=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  const oa=id?`https://line.me/R/oaMessage/${encodeURIComponent(id.startsWith('@')?id:'@'+id)}/?`:'';
  const url=id?`https://line.me/R/oaMessage/${encodeURIComponent(id.startsWith('@')?id:'@'+id)}/?${encodeURIComponent(text)}`:`https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
  box.innerHTML=`<section class="card" id="orderCard"><h2>この内容で送ります</h2><div id="keepArea"></div>${st.ono?`<div class="info" style="font-weight:700">受付番号：<span style="font-size:22px;letter-spacing:.06em;font-family:ui-monospace,Menlo,Consolas,monospace">${esc(st.ono)}</span><br><span class="note">お問い合わせの際にお伝えください。お店からの受付完了のご連絡（LINE・メール）にも同じ番号が書かれています。</span></div>`:''}<div class="msg" id="msgText">${esc(text)}</div>
    <div id="sendArea">
    ${isPC?`<div class="warn" style="margin-bottom:10px"><b>パソコンからご注文の方へ</b><br>パソコンではLINEアプリが開かないため、下の①か②で送信してください。</div>`:''}
    ${isPC?'':`<a class="btn line" id="lineBtn" href="${esc(url)}" target="_blank" rel="noopener" style="width:100%">LINEで注文を送る</a>
    ${id?'':'<div class="note">LINEが開いたら、送り先に「'+esc(s.name||'お店')+'」のトークを選んでください。</div>'}
    <div class="note" style="margin:10px 0 4px">LINEを使わない方は、メールでも送れます。</div>`}
    <div class="info" style="margin-top:8px"><b>${isPC?'① ':''}メールで連絡を受ける</b><br><span class="note">ご注文はこの画面からそのままお店に届きます。お店から受付完了のご連絡をメールでお送りします。</span>
      <label class="f" style="margin-top:8px"><span>メールアドレス<span class="req">必須</span></span><input type="email" id="c_email" autocomplete="email" inputmode="email" placeholder="例：mifune@example.com" value="${esc(st.email||'')}"></label>
      <div class="warn" id="mailErr" hidden></div>
      <button type="button" class="btn pri" id="mailSend" style="width:100%;margin-top:8px">この内容で送信する（メールで連絡）</button></div>
    ${isPC&&oa?`<div class="info" style="margin-top:10px"><b>② スマホのLINEで送る</b><br><span class="note">ボタンを押すと、ご注文の内容がお店の受付表に届き、QRコードが出ます。スマホのカメラで読み取るとLINEが開きます（受付番号が入っています）。<b>そのままLINEで送信してください。</b>お店からの受付完了のご連絡や、以後のやりとりはLINEでいたします。</span>
      <button type="button" class="btn line" id="qrBtn" style="width:100%;margin-top:8px">ご注文を送って、LINE用のQRコードを出す</button><div id="qrBox" style="text-align:center"></div></div>`:''}
    <button type="button" class="btn" id="copyBtn" style="margin-top:10px">文面をコピーする（パソコン版LINEに貼り付ける方）</button>
    <div class="note">${s.tel?`お電話（<a href="tel:${esc(String(s.tel).replace(/[^0-9+]/g,''))}">${esc(s.tel)}</a>${s.telHours?'・'+esc(s.telHours):''}）${s.fax?`・FAX（${esc(s.fax)}）`:''}でも承ります。`:''}</div>
    </div>
    <div class="note">見込み合計は目安です。お店からの受付完了のご連絡で金額が確定します。</div>
    <div class="note">いたずら・虚偽のご注文はお断りします。初めてのお客様や大口のご注文は、お店からお電話で内容を確認してから確定する場合があります。</div>
    ${D.cancelText?`<div class="info" style="margin-bottom:8px"><b>変更・キャンセルについて</b><br>${esc(D.cancelText)}</div>`:''}
    <div class="warn">送信後、${D.confirmPhrase?esc(D.confirmPhrase)+'に':''}お店から受付完了のご連絡がない場合は、お手数ですが${D.contactBack?esc(D.contactBack):'お電話またはLINEでお店にご連絡ください。'}</div></section>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
  const once=()=>{if(!once.d){once.d=1;markSent();showKeep()}};const lb=$('#lineBtn');if(lb)lb.addEventListener('click',()=>{sendInbox(text);once()});
  const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  const ms=$('#mailSend');if(ms)ms.onclick=()=>{const v=toHalf($('#c_email').value.trim());const er=$('#mailErr');
    if(!okMail(v)){er.hidden=false;er.textContent='メールアドレスを正しく入れてください（例：mifune@example.com）';$('#c_email').focus();return}
    st.email=v;save();saveProfile();const ei=$('#i_email');if(ei)ei.value=v;
    const t2=message(calc()).replace('（注文フォームより送信）','（注文フォームよりメールで送信・メールでの連絡希望）');sendInbox(t2);once();
    const mt=s.email?`mailto:${s.email}?subject=${encodeURIComponent(`【ご注文】${C.name||''} ${st.name}様 受付番号${st.ono||''}`)}&body=${encodeURIComponent(t2)}`:'';
    $('#sendArea').innerHTML=`<div class="info"><b>ご注文を送信しました。</b><br>受付番号：<b>${esc(st.ono||'')}</b><br>お店から <b>${esc(v)}</b> あてに、まず「ご注文内容の控え」のメールが自動で届きます。お店で内容を確認したあと、あらためて「受付完了」のメールをお送りします（迷惑メールフォルダもご確認ください）。</div>${mt?`<div class="note" style="margin-top:8px">念のためご自分のメールからも送りたい方は<a href="${esc(mt)}">こちら</a>（メールソフトが開きます）。</div>`:''}`;
    $('#sendArea').scrollIntoView({behavior:'smooth',block:'center'})};
  const qb=$('#qrBtn');if(qb)qb.onclick=()=>{const t2=text.replace('（注文フォームより送信）','（パソコンの注文フォームより送信・LINEで連絡）');sendInbox(t2);once();
    const short=`【ご注文】${C.name||''}\n受付番号：${st.ono||''}\n${st.name}様\n（注文フォームで送った注文です。詳しい内容はお店に届いています）`;
    const box2=$('#qrBox');try{box2.innerHTML=`<div style="display:inline-block;background:#fff;padding:8px;border-radius:10px;margin-top:10px">${window.mifuneQrSvg(oa+encodeURIComponent(short),240)}</div><div class="note">スマホのカメラで読み取り、開いたLINEで<b>「送信」</b>を押してください。LINEで送っていただくと、受付完了のご連絡をLINEでお届けできます。</div>`}catch(e){box2.innerHTML='<div class="warn">QRコードを表示できませんでした。①のメールか、お電話でご注文ください。</div>'}
    qb.textContent='お店の受付表に届きました。下のQRコードからLINEで送信してください';qb.disabled=true};
  $('#copyBtn').onclick=async()=>{sendInbox(text);once();try{await navigator.clipboard.writeText(text);$('#copyBtn').textContent='コピーしました。LINEのトークに貼り付けて送ってください'}catch(e){const sel=getSelection(),rg=document.createRange();rg.selectNodeContents($('#msgText'));sel.removeAllRanges();sel.addRange(rg);$('#copyBtn').textContent='文面を選択しました。コピーしてLINEに貼り付けてください'}};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.d){const k=b.dataset.k;st.qty[k]=Math.max(0,(+st.qty[k]||0)+(+b.dataset.d));const i=document.querySelector(`[data-q="${CSS.escape(k)}"]`);if(i)i.value=st.qty[k]||'';save();updateBar();return}
  if(b.dataset.m){readInputs();st.method=b.dataset.m;if(!dates().includes(st.date))st.date='';if(st.date&&st.time&&!daySlots(st.date).includes(st.time))st.time='';save();render();return}
  if(b.dataset.pay!==undefined){readInputs();st.pay=b.dataset.pay;save();render();return}
  if(b.dataset.date){readInputs();st.date=b.dataset.date;if(st.time&&!daySlots(st.date).includes(st.time))st.time='';save();render();return}
  if(b.dataset.time){readInputs();st.time=st.time===b.dataset.time?'':b.dataset.time;save();render();return}
  if(b.id==='toConfirm'||b.id==='toConfirm2')confirmView();
  if(b.id==='clearProf')clearProfile();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q!==undefined){st.qty[t.dataset.q]=Math.max(0,parseInt(String(t.value).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)))||0);save();updateBar()}else if(t.id&&t.id.startsWith('i_'))readInputs()});
render();
})();
</script>
